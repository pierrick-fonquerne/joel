[package]
name = "runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "runner"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
domain = { path = "../../crates/domain" }
knowledge = { path = "../../crates/knowledge" }
eidos-embedded = { path = "../../crates/eidos-embedded" }
exchange-rates-ecb = { path = "../../crates/exchange-rates-ecb" }
persistence = { path = "../../crates/persistence" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
eidosdb-client = { git = "https://github.com/nubster-opensources/eidosdb", rev = "29d38e81717419602045a6afd89d8c81c5c06a45" }
thiserror = "2"
serde_json = "1"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
rust_decimal = "1"
time = { version = "0.3", features = ["macros"] }
