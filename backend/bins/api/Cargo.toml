[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../../crates/domain" }
knowledge = { path = "../../crates/knowledge" }
eidosdb-client = { git = "https://github.com/nubster-opensources/eidosdb", rev = "29d38e81717419602045a6afd89d8c81c5c06a45" }
persistence = { path = "../../crates/persistence" }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
utoipa = { version = "5", features = ["axum_extras"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
url = "2"
rand = "0.9"
base64 = "0.22"

[dev-dependencies]
domain = { path = "../../crates/domain" }
eidos-embedded = { path = "../../crates/eidos-embedded" }
http-body-util = "0.1"
tower = "0.5"
async-trait = "0.1"
tempfile = "3"
