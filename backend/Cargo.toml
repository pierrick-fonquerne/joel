[workspace]
resolver = "3"
members = ["crates/domain", "crates/cipher-egide", "crates/persistence", "crates/knowledge", "crates/eidos-embedded", "crates/exchange-rates-ecb", "bins/api", "bins/runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
