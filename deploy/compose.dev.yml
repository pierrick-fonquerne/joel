services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: joel
      POSTGRES_USER: joel
      POSTGRES_PASSWORD: joel-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joel -d joel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
